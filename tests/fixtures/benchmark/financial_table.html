<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Benchmark Fixture: Financial Performance Table</title>
</head>
<body>
    <main>
        <h2>Quarterly Financial Performance (Fiscal 2026)</h2>

                    <th>Quarter</th>
                    <th>Revenue ($M)</th>
                    <th>Operating Margin (%)</th>
                    <th>EPS ($)</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr class="row-data">
                    <td class="col-q">Q1 2026</td>
                    <td class="col-rev">425.50</td>
                    <td class="col-margin">24.2</td>
                    <td class="col-eps">1.85</td>
                    <td class="col-status">Audited</td>
                </tr>
                <tr class="row-data">
                    <td class="col-q">Q2 2026</td>
                    <td class="col-rev">468.20</td>
                    <td class="col-margin">26.1</td>
                    <td class="col-eps">2.04</td>
                    <td class="col-status">Audited</td>
                </tr>
                <tr class="row-data">
                    <td class="col-q">Q3 2026</td>
                    <td class="col-rev">512.80</td>
                    <td class="col-margin">27.5</td>
                    <td class="col-eps">2.31</td>
                    <td class="col-status">Audited</td>
                </tr>
                <tr class="row-data">
                    <td class="col-q">Q4 2026</td>
                    <td class="col-rev">550.00</td>
                    <td class="col-margin">28.0</td>
                    <td class="col-eps">2.45</td>
                    <td class="col-status">Reported</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
